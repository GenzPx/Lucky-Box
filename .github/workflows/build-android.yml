name: Build LuckyBox Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "www/**"
      - "res/**"
      - "hooks/**"
      - "utils/**"
      - "config.xml"
      - "package.json"
      - "package-lock.json"
      - "build-extras.gradle"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Run quality gate
        run: npm run quality

      - name: Prepare Cordova Android project
        run: |
          echo false > "${TMPDIR:-/tmp}/fdroid.bool"
          rm -rf platforms plugins
          npx cordova platform add android@15.1.0

      - name: Verify removed native components
        run: |
          set -e
          ! grep -R "com.android.vending.BILLING" platforms/android/app/src/main/AndroidManifest.xml
          ! grep -R "com.google.android.gms\|com.google.firebase\|com.google.android.datatransport" platforms/android/app/src/main/AndroidManifest.xml
          ! grep -R "TerminalService\|AlpineDocumentProvider" platforms/android/app/src/main/AndroidManifest.xml
          ! find platforms/android/app/src/main -type f | grep -E "alpine\.rootfs|libproot|libaxs"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LUCKYBOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LUCKYBOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUCKYBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUCKYBOX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luckybox-release.jks"
          python - <<'PY'
          import json, os
          config = {
              "android": {
                  "release": {
                      "keystore": os.path.join(os.environ["RUNNER_TEMP"], "luckybox-release.jks"),
                      "storePassword": os.environ["STORE_PASSWORD"],
                      "alias": os.environ["KEY_ALIAS"],
                      "password": os.environ["KEY_PASSWORD"],
                      "keystoreType": "jks",
                      "packageType": "apk"
                  }
              }
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "build.json"), "w", encoding="utf-8") as file:
              json.dump(config, file)
          PY

      - name: Build signed release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
        run: |
          echo false > "${TMPDIR:-/tmp}/fdroid.bool"
          npx cordova build android --release --buildConfig="$RUNNER_TEMP/build.json" -- --packageType=apk

      - name: Verify and collect release APK
        run: |
          set -e
          mkdir -p artifacts
          APK="$(find platforms/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          ! find platforms/android/app/build/outputs/apk -path '*debug*' -name '*.apk' | grep .
          apksigner verify --verbose --print-certs "$APK"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            FILE_NAME="LuckyBox-${GITHUB_REF_NAME}.apk"
          else
            FILE_NAME="LuckyBox-release-${GITHUB_SHA::7}.apk"
          fi
          cp "$APK" "artifacts/$FILE_NAME"
          sha256sum "artifacts/$FILE_NAME" | tee artifacts/SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: LuckyBox-Release-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
