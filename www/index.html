<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --splash-bg: #ffc400;
      --splash-ink: #fff8ef;
      --test-height: 45px;
    }
    html,
    body {
      margin: 0;
      background: var(--splash-bg);
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #ffc400;
      color: #184f31;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 320ms ease, visibility 320ms ease;
    }
    body.loading #splash {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .splash-brand {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 18px;
      width: min(72vw, 320px);
    }
    .splash-logo-wrap {
      position: relative;
      width: 174px;
      height: 174px;
      animation: splash-grow 820ms cubic-bezier(.2, .9, .2, 1.15) both;
    }
    .splash-logo {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 14px 18px rgba(92, 34, 0, .28));
    }
    .splash-shine {
      position: absolute;
      inset: 10px;
      overflow: hidden;
      border-radius: 42%;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .splash-shine::after {
      content: "";
      position: absolute;
      top: -35%;
      left: -80%;
      width: 42%;
      height: 170%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .82), transparent);
      animation: splash-shine 1100ms 520ms ease-in-out both;
    }
    .splash-wordmark {
      font: 700 31px/1 system-ui, sans-serif;
      letter-spacing: .08em;
      text-shadow: 0 4px 12px rgba(92, 34, 0, .28);
      animation: splash-wordmark 520ms 430ms ease both;
    }
    .splash-version {
      position: absolute;
      top: max(15px, env(safe-area-inset-top));
      left: max(15px, env(safe-area-inset-left));
      color: rgba(52, 61, 25, .72);
      font: 12px/1.4 monospace;
      white-space: pre;
      text-align: left;
    }
    .splash-message {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      width: 90vw;
      transform: translateX(-50%);
      color: rgba(52, 61, 25, .86);
      font: 14px/1.4 system-ui, sans-serif;
      text-align: center;
    }
    @keyframes splash-grow {
      0% { opacity: 0; transform: scale(.36) rotate(-8deg); }
      65% { opacity: 1; transform: scale(1.06) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes splash-shine {
      0% { left: -80%; opacity: 0; }
      20% { opacity: 1; }
      100% { left: 140%; opacity: 0; }
    }
    @keyframes splash-wordmark {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-logo-wrap,
      .splash-wordmark,
      .splash-shine::after {
        animation: none;
      }
    }
  </style>
  <script>
    (function () {
      var minimumWebViewMajor = 67;
      var pendingMessage = "";
      var waitingForBody = false;
      document.documentElement.style.backgroundColor = "#ffc400";
      function webViewMajor() {
        var match = navigator.userAgent.match(/(?:Chrome|CriOS)\/(\d+)/);
        return match ? Number(match[1]) : 0;
      }
      function loading() {
        return !document.body || document.body.classList.contains("loading");
      }
      function applyMessage() {
        waitingForBody = false;
        if (document.body && loading()) document.body.setAttribute("data-small-msg", pendingMessage);
      }
      function setMessage(message) {
        pendingMessage = message;
        if (document.body) applyMessage();
        else if (!waitingForBody) {
          waitingForBody = true;
          document.addEventListener("DOMContentLoaded", applyMessage, { once: true });
        }
      }
      var supportsModernJavaScript = false;
      try {
        supportsModernJavaScript = !!new Function("return (()=>{})")();
      } catch (error) {}
      if (!supportsModernJavaScript) setMessage("LuckyBox requires a modern Android System WebView.");
      window.__LUCKYBOX_WEBVIEW_MAJOR__ = webViewMajor();
      window.__LUCKYBOX_MIN_WEBVIEW_MAJOR__ = minimumWebViewMajor;
      if (supportsModernJavaScript && window.__LUCKYBOX_WEBVIEW_MAJOR__ && window.__LUCKYBOX_WEBVIEW_MAJOR__ < minimumWebViewMajor) {
        setMessage("Update Android System WebView or Chrome if LuckyBox stays on this screen.");
      }
      window.addEventListener("error", function (event) {
        if (loading()) setMessage("LuckyBox failed to start. " + (event.message || "Startup error"));
      });
      window.addEventListener("unhandledrejection", function (event) {
        if (!loading()) return;
        var reason = event && event.reason;
        setMessage("LuckyBox failed to start. " + (reason && reason.message ? reason.message : "Startup promise failed"));
      });
    })();
  </script>
  <script src="cordova.js"></script>
  <script src="./build/boot.js"></script>
  <title>LuckyBox</title>
</head>
<body class="loading" data-version="" data-small-msg="">
  <div id="splash">
    <div class="splash-brand">
      <div class="splash-logo-wrap">
        <img class="splash-logo" src="./logo.svg" alt="">
        <span class="splash-shine"></span>
      </div>
      <div class="splash-wordmark">LuckyBox</div>
    </div>
    <div class="splash-version"></div>
    <div class="splash-message"></div>
  </div>
  <wc-page id="root" class="primary"></wc-page>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var splash = document.getElementById("splash");
      function updateSplash() {
        splash.querySelector(".splash-version").textContent = document.body.getAttribute("data-version") || "";
        splash.querySelector(".splash-message").textContent = document.body.getAttribute("data-small-msg") || "";
      }
      updateSplash();
      new MutationObserver(updateSplash).observe(document.body, {
        attributes: true,
        attributeFilter: ["data-version", "data-small-msg"]
      });
    });
  </script>
</body>
</html>
