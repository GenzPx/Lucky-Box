<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuckyBox Splash Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #ffc400;
      color: #184f31;
      font-family: system-ui, sans-serif;
    }
    .brand {
      display: grid;
      justify-items: center;
      gap: 18px;
    }
    .logo-wrap {
      position: relative;
      width: 190px;
      height: 190px;
      animation: grow 820ms cubic-bezier(.2, .9, .2, 1.15) both;
    }
    .logo {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 14px 18px rgba(92, 34, 0, .28));
    }
    .shine {
      position: absolute;
      inset: 10px;
      overflow: hidden;
      border-radius: 42%;
      mix-blend-mode: screen;
    }
    .shine::after {
      content: "";
      position: absolute;
      top: -35%;
      left: -80%;
      width: 42%;
      height: 170%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .82), transparent);
      animation: shine 1100ms 520ms ease-in-out both;
    }
    .wordmark {
      font-size: 32px;
      font-weight: 750;
      letter-spacing: .08em;
      text-shadow: 0 4px 12px rgba(92, 34, 0, .28);
      animation: wordmark 520ms 430ms ease both;
    }
    button {
      position: fixed;
      bottom: 24px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, .42);
      border-radius: 999px;
      background: rgba(92, 34, 0, .2);
      color: white;
      font: inherit;
    }
    @keyframes grow {
      0% { opacity: 0; transform: scale(.36) rotate(-8deg); }
      65% { opacity: 1; transform: scale(1.06) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes shine {
      0% { left: -80%; opacity: 0; }
      20% { opacity: 1; }
      100% { left: 140%; opacity: 0; }
    }
    @keyframes wordmark {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="brand" id="brand">
    <div class="logo-wrap">
      <img class="logo" src="../www/logo.svg" alt="LuckyBox clover">
      <span class="shine"></span>
    </div>
    <div class="wordmark">LuckyBox</div>
  </main>
  <button type="button" id="replay">Replay animation</button>
  <script>
    document.getElementById("replay").addEventListener("click", function () {
      var brand = document.getElementById("brand");
      var clone = brand.cloneNode(true);
      brand.replaceWith(clone);
    });
  </script>
</body>
</html>
